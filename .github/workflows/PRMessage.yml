name: PR Comment

# Leaves a comment on a new pull-request, made of two collapsible sections:
#
# - "Information about what will happen to your PR", the fixed text of `.github/PRMessage.md`;
# - "Summary of your PR for reviewers", made by `lake exe pr_summary`, which substitutes the
#   `<!-- PR_SUMMARY -->` marker of that file.
#
# `pr_summary` is built from `master`, and only reads the diff of the branch of the pull-request,
# so no code of the pull-request is run.
#
# The tests of `pr_summary` are `#guard_msgs` commands in its source, so building it runs them.
# The `test` job below does that whenever the script changes.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The number of the pull-request to comment on
        required: true
        type: string
  pull_request_target:
    types: [opened]
  push:
    paths:
      - scripts/github/pr_summary.lean
      - .github/workflows/PRMessage.yml
  pull_request:
    paths:
      - scripts/github/pr_summary.lean
      - .github/workflows/PRMessage.yml

# Limit permissions for GITHUB_TOKEN for the entire workflow
permissions:
  contents: read
  pull-requests: write  # Only allow PR comments
  # All other permissions are implicitly 'none'

jobs:
  test:
    name: Test pr_summary
    # The pull-request which changes the script, not the one to comment on.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The whole history, so that the smoke test below has something to diff.
          fetch-depth: 0

      - name: Configure Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      # The `#guard_msgs` tests of the script run as it is compiled, so this fails if one of
      # them fails.
      - name: Build pr_summary and run its tests
        run: lake build pr_summary

      - name: Summarise the last commit
        run: ./.lake/build/bin/pr_summary HEAD~1 HEAD

  comment:
    name: Comment a pull_request
    if: github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Find the pull-request to comment on
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The number comes from the event for a pull-request, and from the input for a
          # manual run.
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          gh pr view "${PR}" --repo "${GITHUB_REPOSITORY}" \
            --json number,baseRefOid,headRefOid \
            --jq '"number=\(.number)\nbase=\(.baseRefOid)\nhead=\(.headRefOid)"' \
            | tee -a "${GITHUB_OUTPUT}"

      - name: Checkout master to build pr_summary from
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master
          path: tools

      - name: Configure Lean
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          lake-package-directory: tools # Building here

      - name: Build pr_summary from master
        working-directory: tools
        run: lake build pr_summary

      - name: Checkout the branch of the pull-request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.pr.outputs.head }}
          # The whole history, so that the base of the pull-request is there to diff against.
          fetch-depth: 0
          path: pr-branch
          # Untrusted (potentially fork) checkout: don't persist the GITHUB_TOKEN into its
          # .git/config.
          persist-credentials: false
          # pr_summary is built from the trusted base checkout and only reads the diff of this
          # one, so checking out fork PR code under pull_request_target is safe.
          allow-unsafe-pr-checkout: true

      - name: Summarise the pull-request
        working-directory: pr-branch
        env:
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          summary="${RUNNER_TEMP}/summary.md"
          if ! "${GITHUB_WORKSPACE}/tools/.lake/build/bin/pr_summary" \
                 "${BASE}" "${HEAD}" > "${summary}"
          then
            # A comment with no summary is still worth posting.
            printf '*The summary of this PR could not be made; see the logs of this workflow.*\n' \
              > "${summary}"
          fi
          cat "${summary}"

      - name: Assemble the comment
        run: |
          awk -v summary="${RUNNER_TEMP}/summary.md" '
            $0 == "<!-- PR_SUMMARY -->" {
              while ((getline line < summary) > 0) print line
              next
            }
            { print }' tools/.github/PRMessage.md > "${RUNNER_TEMP}/comment.md"
          cat "${RUNNER_TEMP}/comment.md"

      - name: Comment a pull_request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "${PR}" --repo "${GITHUB_REPOSITORY}" \
            --body-file "${RUNNER_TEMP}/comment.md"
